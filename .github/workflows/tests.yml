name: Tests

on:
  push:
    branches: [main]
    # example-backend/ is a self-contained Python project and docs/ + the docs
    # site config don't affect the iOS build, so skip the (macOS, ~30 min) iOS
    # suite for them.
    paths-ignore: ['example-backend/**', 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['example-backend/**', 'docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install XcodeGen
        run: brew install xcodegen

      # REQUIRED: the .xcodeproj is generated by XcodeGen and gitignored, so it
      # does not exist on a fresh checkout. CI must regenerate it from
      # project.yml (the source of truth) before any xcodebuild invocation.
      - name: Generate Xcode project
        run: xcodegen generate

      - name: Run tests
        # OS pinned to 18.6 — the iOS 26 simulator ships a broken accessibility
        # subsystem (the application AX frame reports as 0x0 with no children),
        # which makes every XCUITest query time out even though screens render
        # fine. Delirio hit the same wall; we pin to iOS 18.x until it's fixed.
        # Re-verify on each Xcode/sim bump whether a newer iOS simulator has
        # resolved the broken-AX behavior, and raise the pin when it has.
        #
        # SCOPE: CI exercises only the logic/unit layer + UI smoke tests. The
        # core CallKit + WebRTC live-call path is DEVICE-ONLY (voice plan
        # "Layer 2" — CallKit doesn't run on the simulator and the WebRTC client
        # can't capture the mic there), so real two-way calls are NOT run on
        # GitHub's simulator runners and must be validated on a tethered device.
        run: |
          xcodebuild \
            -scheme Conduit \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=18.6' \
            -resultBundlePath TestResults.xcresult \
            test 2>&1 | tee xcodebuild.log

      - name: Publish test results
        if: always()
        run: |
          {
            echo "## Test Results"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -d TestResults.xcresult ]; then
            echo "⚠️ No \`TestResults.xcresult\` was produced — the build likely failed before tests ran." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Authoritative counts straight from the result bundle. Do NOT grep the
          # log: xcodebuild's non-TTY CI output omits the ✔/✘ glyphs, so a
          # log-based count always reported 0. `xcresulttool get test-results
          # summary` (Xcode 16+) is the source of truth.
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult --format json > test-summary.json 2>/dev/null \
            || echo '{}' > test-summary.json

          TOTAL=$(jq -r '.totalTestCount // 0' test-summary.json)
          PASSED=$(jq -r '.passedTests // 0' test-summary.json)
          FAILED=$(jq -r '.failedTests // 0' test-summary.json)
          SKIPPED=$(jq -r '.skippedTests // 0' test-summary.json)

          if [ "$TOTAL" -eq 0 ]; then
            echo "⚠️ **0 tests ran.** Check that the scheme's test targets are wired and the destination resolved." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$FAILED" -eq 0 ]; then
            echo "✅ **All $PASSED tests passed** ($TOTAL total, $SKIPPED skipped)" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ **$FAILED of $TOTAL tests failed** ($PASSED passed, $SKIPPED skipped)"
              echo ""
              echo "### Failed tests"
              echo '```'
              jq -r '.testFailures[]? | "- \(.testName // .testIdentifier // "unknown"): \(.failureText // "")"' test-summary.json
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Check for Swift warnings
        if: always()
        run: |
          WARNING_COUNT=$(grep -cE "^\/.+\.swift:\d+:\d+: warning:" xcodebuild.log || true)
          echo "Swift warnings: $WARNING_COUNT"
          if [ "$WARNING_COUNT" -gt 0 ]; then
            grep -E "^\/.+\.swift:\d+:\d+: warning:" xcodebuild.log
          fi

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
